[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-cli"
version = "0.1.0"
description = "A governed CLI blueprint for local agentic repository workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "vaflya32407" }]
dependencies = []

[project.scripts]
governed = "governed_cli.cli:main"

[tool.setuptools]
packages = ["governed_cli"]
