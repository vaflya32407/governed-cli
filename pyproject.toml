[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-cli"
version = "0.1.0"
description = "Reference patterns for governed CLI workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "jsonschema>=4.0.0",
]

[project.scripts]
governor = "governed_cli.cli:main"

[tool.setuptools.packages.find]
include = ["governed_cli*"]
